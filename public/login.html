<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/language.js"></script>
    <script type="module" src="js/auth-client.js"></script>
    <script type="module" src="js/auth-forms.js"></script>
</head>
<body class="auth-page">
    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo">JobBoard</a>
        </div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <p class="page-eyebrow">BON RETOUR</p>
            <h1>Connectez-vous</h1>
            <p>Connectez-vous pour retrouver vos alertes, candidatures et offres.</p>

            <form id="auth-form" data-action="login">
                <div class="form-field">
                    <label for="email">Adresse e-mail</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Mot de passe</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Se connecter</button>
                <p class="auth-switch">
                    <a href="forgot-password.html">Mot de passe oublié ?</a>
                </p>
                <p id="auth-feedback" class="form-feedback" role="alert"></p>
            </form>

            <p class="auth-switch">Pas encore de compte ?
                <a href="register.html">Créer un compte</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 JobBoard</p>
    </footer>
</body>
</html>
