<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="jobboard-brand">
    <a href="index.html" class="jobboard-logo">JobBoard</a>

    <nav class="jobboard-nav">
        <a href="index.html">Offres</a>
        <a href="register.html">Créer un compte</a>
    </nav>
</header>

<main>

    <div class="page-header">
        <span class="page-label">ESPACE CANDIDAT</span>
        <h1>Connexion</h1>
        <p>
            Connectez-vous pour gérer votre profil,
            votre CV et vos alertes emploi.
        </p>
    </div>

    <form id="loginForm">

        <label for="email">
            Adresse email
        </label>

        <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
        >

        <label for="password">
            Mot de passe
        </label>

        <input
            type="password"
            id="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Se connecter
        </button>

    </form>

    <p id="message"></p>

    <p>
        <a href="forgot-password.html">
            Mot de passe oublié ?
        </a>
    </p>

    <p>
        Pas encore de compte ?
        <a href="register.html">
            Créer un compte
        </a>
    </p>

</main>


<script>

const form =
    document.getElementById('loginForm');

const message =
    document.getElementById('message');


form.addEventListener(
    'submit',
    async (event) => {

        event.preventDefault();

        message.textContent = '';

        const data = {

            email:
                document.getElementById(
                    'email'
                ).value,

            password:
                document.getElementById(
                    'password'
                ).value
        };

        try {

            const response =
                await fetch(
                    '/api/auth/login.php',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

            const result =
                await response.json();

            if (!response.ok) {

                message.textContent =
                    result.message ||
                    'Email ou mot de passe incorrect.';

                return;
            }

            message.textContent =
                'Connexion réussie.';

            if (
                result.user.role === 'admin'
            ) {

                window.location.href =
                    'admin.html';

            } else {

                window.location.href =
                    'profile.html';
            }

        } catch (error) {

            message.textContent =
                'Erreur de connexion au serveur.';
        }
    }
);

</script>

</body>
</html>
