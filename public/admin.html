<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration - JobBoard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="jobboard-brand">

    <a
        href="admin.html"
        class="jobboard-logo"
    >
        JobBoard
    </a>

    <nav class="jobboard-nav">

        <a href="admin.html">
            Utilisateurs
        </a>

        <a href="index.html">
            Retour au site
        </a>

        <a href="#" id="logoutLink">
            Se déconnecter
        </a>

    </nav>

</header>


<main>

    <div class="page-header">

        <span class="page-label">
            ADMINISTRATION
        </span>

        <h1>
            Gestion des utilisateurs
        </h1>

        <p>
            Consultez les comptes utilisateurs,
            modifiez leurs rôles et gérez les accès
            à la plateforme.
        </p>

    </div>


    <p id="message"></p>


    <section>

        <h2>
            Utilisateurs
        </h2>

        <p>
            Les comptes enregistrés sur la plateforme
            sont affichés ci-dessous.
        </p>

        <div id="usersList">
            Chargement...
        </div>

    </section>


    <section class="account-actions">

        <a
            href="index.html"
            class="button-link"
        >
            Retour au site
        </a>

        <button
            id="logoutButton"
            type="button"
        >
            Se déconnecter
        </button>

    </section>

</main>


<script>

const usersList =
    document.getElementById('usersList');

const message =
    document.getElementById('message');

const logoutButton =
    document.getElementById('logoutButton');

const logoutLink =
    document.getElementById('logoutLink');


// ==============================
// LOAD USERS
// ==============================

async function loadUsers() {

    try {

        const response =
            await fetch(
                '/api/users/admin.php'
            );

        if (response.status === 401) {

            window.location.href =
                'login.html';

            return;
        }

        if (response.status === 403) {

            message.textContent =
                'Accès administrateur requis.';

            usersList.textContent = '';

            return;
        }

        const result =
            await response.json();

        if (!response.ok) {

            usersList.textContent =
                result.message || 'Erreur.';

            return;
        }

        renderUsers(
            result.users
        );

    } catch (error) {

        usersList.textContent =
            'Erreur de connexion au serveur.';
    }
}


// ==============================
// DISPLAY USERS
// ==============================

function renderUsers(users) {

    usersList.innerHTML = '';

    if (!users.length) {

        usersList.textContent =
            'Aucun utilisateur enregistré.';

        return;
    }

    users.forEach((user) => {

        const article =
            document.createElement('article');


        const name =
            document.createElement('h3');

        name.textContent =
            user.firstname +
            ' ' +
            user.lastname;

        article.appendChild(name);


        const email =
            document.createElement('p');

        email.textContent =
            'Email : ' +
            user.email;

        article.appendChild(email);


        if (user.phone) {

            const phone =
                document.createElement('p');

            phone.textContent =
                'Téléphone : ' +
                user.phone;

            article.appendChild(phone);
        }


        const roleInfo =
            document.createElement('p');

        roleInfo.textContent =
            'Rôle actuel : ' +
            (
                user.role === 'admin'
                    ? 'Administrateur'
                    : 'Candidat'
            );

        article.appendChild(roleInfo);


        const roleLabel =
            document.createElement('label');

        roleLabel.textContent =
            'Modifier le rôle';

        article.appendChild(roleLabel);


        const roleSelect =
            document.createElement('select');


        const candidateOption =
            document.createElement('option');

        candidateOption.value =
            'candidate';

        candidateOption.textContent =
            'Candidat';


        const adminOption =
            document.createElement('option');

        adminOption.value =
            'admin';

        adminOption.textContent =
            'Administrateur';


        roleSelect.appendChild(
            candidateOption
        );

        roleSelect.appendChild(
            adminOption
        );

        roleSelect.value =
            user.role;

        article.appendChild(
            roleSelect
        );


        const saveButton =
            document.createElement('button');

        saveButton.textContent =
            'Modifier le rôle';

        saveButton.addEventListener(
            'click',
            () => updateRole(
                user.id,
                roleSelect.value
            )
        );

        article.appendChild(
            saveButton
        );


        const deleteButton =
            document.createElement('button');

        deleteButton.textContent =
            'Supprimer';

        deleteButton.classList.add(
            'danger'
        );

        deleteButton.addEventListener(
            'click',
            () => deleteUser(
                user.id,
                user.email
            )
        );

        article.appendChild(
            deleteButton
        );


        usersList.appendChild(
            article
        );
    });
}


// ==============================
// UPDATE ROLE
// ==============================

async function updateRole(
    id,
    role
) {

    try {

        const response =
            await fetch(
                '/api/users/admin.php?id='
                + id,
                {
                    method: 'PATCH',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            role: role
                        })
                }
            );

        const result =
            await response.json();

        message.textContent =
            result.message;

        if (response.ok) {

            loadUsers();
        }

    } catch (error) {

        message.textContent =
            'Erreur de connexion au serveur.';
    }
}


// ==============================
// DELETE USER
// ==============================

async function deleteUser(
    id,
    email
) {

    const confirmed =
        confirm(
            'Voulez-vous supprimer l’utilisateur '
            + email +
            ' ?'
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                '/api/users/admin.php?id='
                + id,
                {
                    method: 'DELETE'
                }
            );

        const result =
            await response.json();

        message.textContent =
            result.message;

        if (response.ok) {

            loadUsers();
        }

    } catch (error) {

        message.textContent =
            'Erreur de connexion au serveur.';
    }
}


// ==============================
// LOGOUT
// ==============================

async function logout() {

    try {

        await fetch(
            '/api/auth/logout.php',
            {
                method: 'POST'
            }
        );

    } finally {

        window.location.href =
            'login.html';
    }
}


logoutButton.addEventListener(
    'click',
    logout
);


logoutLink.addEventListener(
    'click',
    (event) => {

        event.preventDefault();

        logout();
    }
);


// ==============================
// START
// ==============================

loadUsers();

</script>

</body>
</html>
