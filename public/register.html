<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="jobboard-brand">
    <a href="index.html" class="jobboard-logo">JobBoard</a>

    <nav class="jobboard-nav">
        <a href="index.html">Offres</a>
        <a href="login.html">Se connecter</a>
    </nav>
</header>

<main>

    <div class="page-header">
        <span class="page-label">ESPACE CANDIDAT</span>
        <h1>Créer un compte</h1>
        <p>
            Créez votre profil pour gérer votre CV,
            vos alertes et vos candidatures.
        </p>
    </div>

    <form id="registerForm">

        <label for="firstname">
            Prénom
        </label>

        <input
            type="text"
            id="firstname"
            placeholder="Votre prénom"
            autocomplete="given-name"
            required
        >

        <label for="lastname">
            Nom
        </label>

        <input
            type="text"
            id="lastname"
            placeholder="Votre nom"
            autocomplete="family-name"
            required
        >

        <label for="email">
            Adresse email
        </label>

        <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
        >

        <label for="phone">
            Téléphone
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="06 00 00 00 00"
            autocomplete="tel"
        >

        <label for="password">
            Mot de passe
        </label>

        <input
            type="password"
            id="password"
            placeholder="8 caractères minimum"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <label for="passwordConfirmation">
            Confirmer le mot de passe
        </label>

        <input
            type="password"
            id="passwordConfirmation"
            placeholder="Confirmez votre mot de passe"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <button type="submit">
            Créer mon compte
        </button>

    </form>

    <p id="message"></p>

    <p>
        Déjà un compte ?
        <a href="login.html">
            Se connecter
        </a>
    </p>

</main>


<script>

const form =
    document.getElementById('registerForm');

const message =
    document.getElementById('message');


form.addEventListener(
    'submit',
    async (event) => {

        event.preventDefault();

        message.textContent = '';

        const data = {

            firstname:
                document.getElementById(
                    'firstname'
                ).value,

            lastname:
                document.getElementById(
                    'lastname'
                ).value,

            email:
                document.getElementById(
                    'email'
                ).value,

            phone:
                document.getElementById(
                    'phone'
                ).value,

            password:
                document.getElementById(
                    'password'
                ).value,

            password_confirmation:
                document.getElementById(
                    'passwordConfirmation'
                ).value
        };

        try {

            const response =
                await fetch(
                    '/api/auth/register.php',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

            const result =
                await response.json();

            if (!response.ok) {

                message.textContent =
                    result.message || 'Erreur.';

                return;
            }

            message.textContent =
                'Compte créé avec succès.';

            setTimeout(
                () => {

                    window.location.href =
                        'login.html';

                },
                1000
            );

        } catch (error) {

            message.textContent =
                'Erreur de connexion au serveur.';
        }
    }
);

</script>

</body>
</html>
