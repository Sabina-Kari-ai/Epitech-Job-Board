<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Créer un compte - JobBoard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <script type="module" src="js/auth-nav.js"></script>
</head>

<body>

<header class="navbar">

    <div class="container navbar-content">

        <a
            href="index.html"
            class="logo"
        >
            JobBoard
        </a>

        <nav class="nav-links">
            <a href="index.html#jobs">Offres</a>
            <a href="companies.html">Entreprises</a>
        </nav>

        <div class="nav-actions">
            <a
                href="login.html"
                class="btn btn-outline"
            >
                Connexion
            </a>
        </div>

    </div>

</header>


<main class="apply-section">

<div class="container">

    <div class="apply-layout">

        <div class="apply-info">

            <span class="section-label">
                INSCRIPTION
            </span>

            <h1>
                Créer un compte
            </h1>

            <p>
                Choisissez le type de compte
                que vous souhaitez créer.
            </p>

        </div>


        <div class="application-form">

            <div
                style="
                    display:flex;
                    gap:10px;
                    margin-bottom:30px;
                "
            >

                <button
                    type="button"
                    id="candidateTab"
                    class="btn btn-primary"
                >
                    Je suis candidat
                </button>

                <button
                    type="button"
                    id="companyTab"
                    class="btn btn-outline"
                >
                    Je suis une entreprise
                </button>

            </div>


            <!-- CANDIDATE FORM -->

            <form id="candidateForm">

                <div class="form-group">
                    <label for="candidateFirstname">
                        Prénom
                    </label>

                    <input
                        type="text"
                        id="candidateFirstname"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="candidateLastname">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="candidateLastname"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="candidateEmail">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="candidateEmail"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="candidatePhone">
                        Téléphone
                    </label>

                    <input
                        type="tel"
                        id="candidatePhone"
                    >
                </div>


                <div class="form-group">
                    <label for="candidatePassword">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="candidatePassword"
                        minlength="8"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="candidatePasswordConfirmation">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="candidatePasswordConfirmation"
                        minlength="8"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Créer mon compte candidat
                </button>

            </form>


            <!-- COMPANY FORM -->

            <form
                id="companyForm"
                hidden
            >

                <div class="form-group">
                    <label for="companyFirstname">
                        Prénom du responsable
                    </label>

                    <input
                        type="text"
                        id="companyFirstname"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="companyLastname">
                        Nom du responsable
                    </label>

                    <input
                        type="text"
                        id="companyLastname"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="companyName">
                        Nom de l'entreprise
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="companyLocation">
                        Ville
                    </label>

                    <input
                        type="text"
                        id="companyLocation"
                        placeholder="Ex : Nantes"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="companyDescription">
                        Description de l'entreprise
                    </label>

                    <textarea
                        id="companyDescription"
                        placeholder="Présentez votre entreprise..."
                    ></textarea>
                </div>


                <div class="form-group">
                    <label for="companyWebsite">
                        Site web
                    </label>

                    <input
                        type="url"
                        id="companyWebsite"
                        placeholder="https://..."
                    >
                </div>


                <div class="form-group">
                    <label for="companyEmail">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="companyEmail"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="companyPhone">
                        Téléphone
                    </label>

                    <input
                        type="tel"
                        id="companyPhone"
                    >
                </div>


                <div class="form-group">
                    <label for="companyPassword">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="companyPassword"
                        minlength="8"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="companyPasswordConfirmation">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="companyPasswordConfirmation"
                        minlength="8"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Créer mon compte entreprise
                </button>

            </form>


            <p
                id="registerMessage"
                style="margin-top:20px;"
            ></p>


            <p style="margin-top:20px;">
                Déjà un compte ?
                <a href="login.html">
                    Se connecter
                </a>
            </p>

        </div>

    </div>

</div>

</main>


<footer class="footer">

    <div class="container footer-content">
        <p>© 2026 JobBoard</p>
    </div>

</footer>


<script>

const candidateTab =
    document.getElementById(
        "candidateTab"
    );

const companyTab =
    document.getElementById(
        "companyTab"
    );

const candidateForm =
    document.getElementById(
        "candidateForm"
    );

const companyForm =
    document.getElementById(
        "companyForm"
    );

const registerMessage =
    document.getElementById(
        "registerMessage"
    );


function showCandidateForm() {

    candidateForm.hidden =
        false;

    companyForm.hidden =
        true;

    candidateTab.className =
        "btn btn-primary";

    companyTab.className =
        "btn btn-outline";

    registerMessage.textContent =
        "";
}


function showCompanyForm() {

    candidateForm.hidden =
        true;

    companyForm.hidden =
        false;

    candidateTab.className =
        "btn btn-outline";

    companyTab.className =
        "btn btn-primary";

    registerMessage.textContent =
        "";
}


candidateTab.addEventListener(
    "click",
    showCandidateForm
);


companyTab.addEventListener(
    "click",
    showCompanyForm
);


async function register(data) {

    registerMessage.textContent =
        "Création du compte...";


    try {

        const response =
            await fetch(
                "/api/auth/register.php",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            registerMessage.textContent =
                result.message ||
                "Impossible de créer le compte.";

            return;
        }


        registerMessage.textContent =
            result.message;


        setTimeout(
            function () {

                window.location.href =
                    "login.html";

            },
            800
        );

    } catch (error) {

        registerMessage.textContent =
            "Impossible de contacter le serveur.";
    }
}


candidateForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        register({

            account_type:
                "candidate",

            firstname:
                document.getElementById(
                    "candidateFirstname"
                ).value.trim(),

            lastname:
                document.getElementById(
                    "candidateLastname"
                ).value.trim(),

            email:
                document.getElementById(
                    "candidateEmail"
                ).value.trim(),

            phone:
                document.getElementById(
                    "candidatePhone"
                ).value.trim(),

            password:
                document.getElementById(
                    "candidatePassword"
                ).value,

            password_confirmation:
                document.getElementById(
                    "candidatePasswordConfirmation"
                ).value
        });
    }
);


companyForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        register({

            account_type:
                "company",

            firstname:
                document.getElementById(
                    "companyFirstname"
                ).value.trim(),

            lastname:
                document.getElementById(
                    "companyLastname"
                ).value.trim(),

            company_name:
                document.getElementById(
                    "companyName"
                ).value.trim(),

            company_location:
                document.getElementById(
                    "companyLocation"
                ).value.trim(),

            company_description:
                document.getElementById(
                    "companyDescription"
                ).value.trim(),

            company_website:
                document.getElementById(
                    "companyWebsite"
                ).value.trim(),

            email:
                document.getElementById(
                    "companyEmail"
                ).value.trim(),

            phone:
                document.getElementById(
                    "companyPhone"
                ).value.trim(),

            password:
                document.getElementById(
                    "companyPassword"
                ).value,

            password_confirmation:
                document.getElementById(
                    "companyPasswordConfirmation"
                ).value
        });
    }
);

</script>

</body>
</html>
