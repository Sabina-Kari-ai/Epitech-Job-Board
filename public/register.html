<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte | JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/language.js" defer></script>
    <script type="module" src="js/auth-client.js" defer></script>
    <script type="module" src="js/auth-forms.js" defer></script>
</head>
<body class="auth-page">
    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo">JobBoard</a>
        </div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <p class="page-eyebrow">REJOIGNEZ JOBBOARD</p>
            <h1>Créez votre compte</h1>
            <p>Choisissez votre espace : candidat ou entreprise.</p>

            <form id="auth-form" data-action="register">
                <div class="form-field">
                    <label for="account-type">Type de compte</label>
                    <select id="account-type" name="account_type" required>
                        <option value="candidate">Candidat</option>
                        <option value="company">Entreprise</option>
                    </select>
                </div>
                <div class="auth-name-grid">
                    <div class="form-field">
                        <label for="first-name">Prénom</label>
                        <input id="first-name" name="first_name" type="text"
                               autocomplete="given-name" required>
                    </div>
                    <div class="form-field">
                        <label for="last-name">Nom</label>
                        <input id="last-name" name="last_name" type="text"
                               autocomplete="family-name" required>
                    </div>
                </div>
                <div id="company-fields" hidden>
                    <div class="form-field">
                        <label for="company-name">Nom de l'entreprise</label>
                        <input id="company-name" name="company_name" type="text"
                               autocomplete="organization">
                    </div>
                    <div class="form-field">
                        <label for="company-location">Ville de l'entreprise</label>
                        <input id="company-location" name="company_location" type="text"
                               autocomplete="address-level2">
                    </div>
                    <div class="form-field">
                        <label for="company-siret">Numéro SIRET</label>
                        <input id="company-siret" name="company_siret" type="text"
                               inputmode="numeric" autocomplete="off"
                               pattern="[0-9 ]{14,17}" maxlength="17"
                               placeholder="Ex : 732 829 320 00074">
                        <small>14 chiffres. Votre inscription sera vérifiée par notre équipe avant la publication de vos offres.</small>
                    </div>
                </div>
                <div class="form-field">
                    <label for="email">Adresse e-mail</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Mot de passe</label>
                    <input id="password" name="password" type="password"
                           autocomplete="new-password" minlength="6" required>
                    <small>6 caractères minimum.</small>
                </div>
                <button class="btn btn-primary" type="submit">Créer mon compte</button>
                <p id="auth-feedback" class="form-feedback" role="alert"></p>
            </form>

            <p class="auth-switch">Déjà inscrit ?
                <a href="login.html">Se connecter</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 JobBoard</p>
    </footer>
</body>
</html>
