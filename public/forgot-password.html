<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mot de passe oublié - JobBoard</title>

    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-nav.js"></script>
</head>

<body class="auth-page">

<header class="jobboard-brand">

    <a href="index.html" class="jobboard-logo">
        JobBoard
    </a>

    <nav class="jobboard-nav">
        <a href="index.html">Offres</a>
        <a href="login.html">Se connecter</a>
        <a href="register.html">Créer un compte</a>
    </nav>

</header>


<main>

    <div class="page-header">

        <span class="page-label">
            SÉCURITÉ
        </span>

        <h1>
            Mot de passe oublié
        </h1>

        <p>
            Indiquez votre adresse email pour
            réinitialiser votre mot de passe.
        </p>

    </div>


    <form id="forgotForm">

        <label for="email">
            Adresse email
        </label>

        <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
        >

        <button type="submit">
            Réinitialiser mon mot de passe
        </button>

    </form>


    <p id="message"></p>


    <p>
        <a href="login.html">
            ← Retour à la connexion
        </a>
    </p>

</main>


<script>

const form =
    document.getElementById('forgotForm');

const message =
    document.getElementById('message');

form.addEventListener(
    'submit',
    async (event) => {

        event.preventDefault();

        message.textContent = '';

        const data = {

            email:
                document.getElementById(
                    'email'
                ).value
        };

        try {

            const response =
                await fetch(
                    '/api/auth/forgot-password.php',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

            const result =
                await response.json();

            message.textContent =
                result.message ||
                'Demande traitée.';

        } catch (error) {

            message.textContent =
                'Erreur de connexion au serveur.';
        }
    }
);

</script>

</body>
</html>
