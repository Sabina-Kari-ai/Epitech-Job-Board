<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mot de passe oublié | JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/language.js"></script>
    <script type="module" src="js/forgot-password.js"></script>
</head>

<body class="auth-page">
    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo">JobBoard</a>
            <a href="login.html" class="auth-back-link">Retour à la connexion</a>
        </div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <p class="page-eyebrow">SÉCURITÉ DU COMPTE</p>
            <h1>Mot de passe oublié</h1>
            <p>Indiquez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>

            <form id="forgotForm">
                <div class="form-field">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email"
                           autocomplete="email" maxlength="191" required>
                </div>
                <button class="btn btn-primary" type="submit" id="submitButton">
                    Envoyer le lien de réinitialisation
                </button>
                <p id="message" class="form-feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 JobBoard</p>
    </footer>
</body>
</html>
