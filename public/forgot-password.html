<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Job Board</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
    <h1>Mot de passe oublié</h1>

    <form id="forgotForm">
        <label for="email">Adresse email</label>
        <input type="email" id="email" required>

        <button type="submit">
            Réinitialiser mon mot de passe
        </button>
    </form>

    <p id="message"></p>

    <div id="developmentReset" hidden>
        <p>
            Mode développement : le token de réinitialisation
            a été généré.
        </p>

        <a id="resetLink" href="#">
            Continuer vers la réinitialisation
        </a>
    </div>

    <p>
        <a href="login.html">Retour à la connexion</a>
    </p>
</main>

<script>
const form = document.getElementById('forgotForm');
const message = document.getElementById('message');
const developmentReset =
    document.getElementById('developmentReset');
const resetLink =
    document.getElementById('resetLink');

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    message.textContent = '';
    developmentReset.hidden = true;

    const data = {
        email: document.getElementById('email').value
    };

    try {
        const response = await fetch(
            '/api/auth/forgot-password.php',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        message.textContent =
            result.message || 'Demande traitée.';

        if (
            response.ok &&
            result.development_reset_token
        ) {
            const token =
                encodeURIComponent(
                    result.development_reset_token
                );

            resetLink.href =
                'reset-password.html?token=' + token;

            developmentReset.hidden = false;
        }

    } catch (error) {
        message.textContent =
            'Erreur de connexion au serveur.';
    }
});
</script>

</body>
</html>
