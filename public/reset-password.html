<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe | JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/language.js"></script>
    <script type="module" src="js/reset-password.js"></script>
</head>
<body class="auth-page">
    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo">JobBoard</a>
            <a href="login.html" class="auth-back-link">Retour à la connexion</a>
        </div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <p class="page-eyebrow">SÉCURITÉ DU COMPTE</p>
            <h1>Nouveau mot de passe</h1>
            <p>Choisissez un nouveau mot de passe pour votre compte.</p>

            <form id="resetForm">
                <div class="form-field">
                    <label for="new-password">Nouveau mot de passe</label>
                    <input id="new-password" name="new_password" type="password"
                           autocomplete="new-password" minlength="6" required>
                </div>
                <div class="form-field">
                    <label for="confirm-password">Confirmer le mot de passe</label>
                    <input id="confirm-password" name="confirm_password" type="password"
                           autocomplete="new-password" minlength="6" required>
                </div>
                <button class="btn btn-primary" type="submit" id="submitButton">
                    Enregistrer le nouveau mot de passe
                </button>
                <p id="message" class="form-feedback" role="status" aria-live="polite"></p>
            </form>

            <p id="login-link" class="auth-switch" hidden>
                <a href="login.html">Se connecter</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 JobBoard</p>
    </footer>
</body>
</html>
