<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nouveau mot de passe - JobBoard</title>

    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-nav.js"></script>
</head>

<body>

<header class="jobboard-brand">

    <a href="index.html" class="jobboard-logo">
        JobBoard
    </a>

    <nav class="jobboard-nav">
        <a href="index.html">Offres</a>
        <a href="login.html">Se connecter</a>
    </nav>

</header>


<main>

    <div class="page-header">

        <span class="page-label">
            SÉCURITÉ
        </span>

        <h1>
            Nouveau mot de passe
        </h1>

        <p>
            Choisissez un nouveau mot de passe
            sécurisé pour votre compte.
        </p>

    </div>


    <form id="resetForm">

        <label for="password">
            Nouveau mot de passe
        </label>

        <input
            type="password"
            id="password"
            placeholder="8 caractères minimum"
            minlength="8"
            autocomplete="new-password"
            required
        >


        <label for="passwordConfirmation">
            Confirmer le mot de passe
        </label>

        <input
            type="password"
            id="passwordConfirmation"
            placeholder="Confirmez votre mot de passe"
            minlength="8"
            autocomplete="new-password"
            required
        >


        <button type="submit">
            Modifier le mot de passe
        </button>

    </form>


    <p id="message"></p>


    <p>
        <a href="login.html">
            ← Retour à la connexion
        </a>
    </p>

</main>


<script>

const form =
    document.getElementById('resetForm');

const message =
    document.getElementById('message');


const params =
    new URLSearchParams(
        window.location.search
    );

const token =
    params.get('token');


if (!token) {

    message.textContent =
        'Token de réinitialisation manquant.';

    form.style.display =
        'none';
}


form.addEventListener(
    'submit',
    async (event) => {

        event.preventDefault();

        message.textContent = '';

        const data = {

            token: token,

            password:
                document.getElementById(
                    'password'
                ).value,

            password_confirmation:
                document.getElementById(
                    'passwordConfirmation'
                ).value
        };

        try {

            const response =
                await fetch(
                    '/api/auth/reset-password.php',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

            const result =
                await response.json();

            message.textContent =
                result.message || 'Erreur.';

            if (response.ok) {

                form.reset();

                setTimeout(
                    () => {

                        window.location.href =
                            'login.html';

                    },
                    1200
                );
            }

        } catch (error) {

            message.textContent =
                'Erreur de connexion au serveur.';
        }
    }
);

</script>

</body>
</html>
