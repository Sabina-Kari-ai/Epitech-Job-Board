<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Détail de l'offre - JobBoard</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/language.js" defer></script>
    <script src="js/auth-client.js" defer></script>
    <script src="js/alert-notifications.js" defer></script>
    <script src="js/nav-auth.js" defer></script>
</head>

<body>

    <!-- En-tête -->
    <header class="navbar">
        <div class="container navbar-content">

            <a href="index.html" class="logo">
                JobBoard
            </a>

            <nav class="nav-links" aria-label="Navigation principale">
                <a href="index.html#jobs">Offres</a>
                <a href="companies.html">Entreprises</a>
            </nav>

            <div class="nav-actions" id="guest-actions">
                <a href="login.html" class="btn btn-outline">Connexion</a>
                <a href="register.html" class="btn btn-primary">Créer un compte</a>
            </div>

            <div class="nav-actions authenticated-actions" id="authenticated-actions" hidden>
                <a href="alerts.html" class="nav-icon-link" aria-label="Mes alertes" title="Mes alertes">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                        <path d="M10 21h4"></path>
                    </svg>
                </a>
                <details class="profile-menu">
                    <summary class="nav-icon-link" aria-label="Ouvrir le menu du profil" title="Mon profil">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21a8 8 0 0 1 16 0"></path>
                        </svg>
                    </summary>
                    <div class="profile-dropdown">
                        <p class="profile-menu-name" id="user-first-name"></p>
                        <a href="profile.html">Mon profil</a>
                        <a href="app.html">Mes candidatures</a>
                        <button type="button" id="logout-button">Déconnexion</button>
                    </div>
                </details>
            </div>

        </div>
    </header>


    <!-- Détail de l'offre -->
    <main class="job-detail-section">

        <div class="container">

            <!-- Retour aux offres -->
            <a href="index.html" class="back-link">
                ← Retour aux offres
            </a>

            <!-- Contenu -->
            <div id="jobDetail" class="job-detail">

                <p>Chargement de l'offre...</p>

            </div>

        </div>

    </main>


    <!-- Pied de page -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 JobBoard - Epitech</p>
        </div>
    </footer>


    <script src="js/job-detail.js" defer></script>

</body>
</html>
