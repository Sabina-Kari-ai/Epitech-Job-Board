<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postuler - JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="container">
        <a href="index.html" class="logo">JobBoard</a>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Offres</a></li>
                <li><a href="app.html">Mes candidatures</a></li>
                <li><a href="#">Connexion</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="apply-section">
    <div class="container">

        <a href="index.html" class="back-link">← Retour aux offres</a>

        <div class="apply-layout">

            <div class="apply-info">
                <h1>Postuler à une offre</h1>
                <p id="jobTitle"></p>
            </div>

            <form id="applicationForm" class="application-form">

                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="Présentez votre candidature..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="details-button">
                    Envoyer ma candidature
                </button>

                <p id="formMessage"></p>

            </form>

        </div>

    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 JobBoard - Epitech</p>
    </div>
</footer>

<script src="js/apply.js"></script>

</body>
</html>
