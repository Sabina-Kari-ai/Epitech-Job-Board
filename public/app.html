<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes candidatures - JobBoard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/language.js" defer></script>
</head>

<body data-auth-required="true">

    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo">JobBoard</a>

            <nav class="nav-links">
                <a href="index.html#jobs">Offres</a>
                <a href="app.html">Mes candidatures</a>
            </nav>

            <div class="nav-actions" id="guest-actions">
                <a href="login.html" class="btn btn-outline">Connexion</a>
                <a href="register.html" class="btn btn-primary">Créer un compte</a>
            </div>

            <div class="nav-actions authenticated-actions" id="authenticated-actions" hidden>
                <a href="alerts.html" class="nav-icon-link" aria-label="Mes alertes" title="Mes alertes">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                        <path d="M10 21h4"></path>
                    </svg>
                </a>
                <details class="profile-menu">
                    <summary class="nav-icon-link" aria-label="Ouvrir le menu du profil" title="Mon profil">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21a8 8 0 0 1 16 0"></path>
                        </svg>
                    </summary>
                    <div class="profile-dropdown">
                        <p class="profile-menu-name" id="user-first-name"></p>
                        <a href="profile.html">Mon profil</a>
                        <a href="app.html">Mes candidatures</a>
                        <button type="button" id="logout-button">Déconnexion</button>
                    </div>
                </details>
            </div>
        </div>
    </header>

    <main>
        <section class="applications-section">
            <div class="container">

                <div class="applications-header">
                    <span class="section-label">CANDIDATURES</span>
                    <h1>Mes candidatures</h1>
                    <p>
                        Retrouvez toutes les offres auxquelles vous avez postulé.
                    </p>
                </div>

                <div id="applications-list"></div>

            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div>
                <strong>JobBoard</strong>
                <p>Trouvez simplement votre prochaine opportunité.</p>
            </div>

            <p>© 2026 JobBoard</p>
        </div>
    </footer>

    <script src="js/auth-client.js" defer></script>
    <script src="js/alert-notifications.js" defer></script>
    <script src="js/nav-auth.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
